<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Valentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#F5DEE2; --bg2:#EBC3CC; --ink:#3A1B2E; --paper:#E2909F; --paper-hi:#EDA9B5; --paper-in:#C46E7E;
  --seal:#8B2438; --card:#FFF8F0; --accent:#2F8F8F; --muted:#7a4a5c;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Script", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241028; --bg2:#3E1B43; --ink:#FBEAE6; --paper:#E8AEB8; --paper-hi:#F2C2C9; --paper-in:#C98795;
    --seal:#A32B44; --accent:#5FB8B5; --muted:#d3a9b8;
  }
}
:root[data-theme="dark"]{
  --bg:#241028; --bg2:#3E1B43; --ink:#FBEAE6; --paper:#E8AEB8; --paper-hi:#F2C2C9; --paper-in:#C98795;
  --seal:#A32B44; --accent:#5FB8B5; --muted:#d3a9b8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg) 72%);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  opacity:0;pointer-events:none;transition:opacity .9s ease}
.scene.show{opacity:1;pointer-events:auto}

/* ---------- Sobre ---------- */
.env{position:relative;display:block;width:min(84vw,360px);aspect-ratio:3/2;perspective:900px;margin-top:6vh}
.env span{display:block}
.env .back{position:absolute;inset:0;background:var(--paper-in);border-radius:6px;box-shadow:0 18px 40px rgba(40,10,30,.35)}
.env .card{position:absolute;left:7%;right:7%;top:9%;bottom:9%;background:var(--card);border-radius:4px;z-index:2;
  transition:transform 1.1s cubic-bezier(.3,.7,.2,1) .55s;display:flex;align-items:flex-start;justify-content:center;padding-top:14%}
.env .card i{font-style:normal;color:var(--seal);font-size:1.8rem}
.env .front{position:absolute;inset:0;z-index:3;background:var(--paper);border-radius:6px;
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.env .front::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(60,10,40,.12),transparent 60%)}
.env .to{position:absolute;left:0;right:0;bottom:12%;text-align:center;z-index:4;font-family:var(--hand);font-size:clamp(1.5rem,7vw,2.1rem);color:var(--seal);transition:opacity .4s}
.env .flap{position:absolute;left:0;top:0;width:100%;height:54%;z-index:5;background:var(--paper-hi);
  clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .9s cubic-bezier(.4,.1,.2,1)}
.env .seal{position:absolute;left:50%;top:54%;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:6;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c4455c,var(--seal) 70%);box-shadow:0 3px 8px rgba(0,0,0,.35);
  display:grid!important;place-items:center;color:#ffd9de;font-size:1.5rem;transition:opacity .35s,transform .35s}
.env.open .flap{transform:rotateX(180deg);background:var(--paper-in);z-index:1}
.env.open .seal{opacity:0;transform:scale(.4)}
.env.open .to{opacity:0}
.env.open .card{transform:translateY(-58%)}
.env.pulse .seal{animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.hint{margin-top:34px;font-family:var(--hand);font-size:1.6rem;color:var(--muted);transition:opacity .4s}

/* ---------- Fotos ---------- */
.pol{background:var(--card);padding:12px 12px 46px;border-radius:3px;box-shadow:0 16px 38px rgba(30,5,25,.38);
  transform:rotate(var(--r,0deg));transition:opacity .45s ease,transform .6s ease}
.pol.out{opacity:0;transform:translateY(18px) rotate(calc(var(--r,0deg) * -1))}
.pol img{display:block;max-width:min(84vw,420px);max-height:58vh;min-width:200px;min-height:200px;object-fit:contain;background:#eadbd5}
.ctrls{display:flex;align-items:center;gap:22px;margin-top:30px}
.ctrls button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--muted);font-size:1.3rem;line-height:1;display:grid;place-items:center}
.bar{width:min(84vw,420px);height:3px;background:color-mix(in srgb,var(--muted) 35%,transparent);margin-top:22px;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--seal);transition:width .5s}
.count{margin-top:10px;font-family:var(--hand);font-size:1.25rem;color:var(--muted)}

/* ---------- Carta ---------- */
.letter{width:100%;max-width:560px;height:100%;overflow-y:auto;padding:8vh 6px 12vh;scroll-behavior:smooth;scrollbar-width:none}
.letter::-webkit-scrollbar{display:none}
.letter p{font-style:italic;font-weight:500;font-size:clamp(1.2rem,4.6vw,1.45rem);line-height:1.62;margin-bottom:1.35em;
  opacity:0;transform:translateY(10px);transition:opacity 1.4s ease,transform 1.4s ease}
.letter p.on{opacity:1;transform:none}
.ask{text-align:center;opacity:0;transition:opacity 1.6s ease;padding-top:3vh}
.ask.on{opacity:1}
.ask h2{font-style:italic;font-weight:600;font-size:clamp(2.2rem,10vw,3.4rem);line-height:1.1;margin-bottom:1.2em}
.btns{display:flex;gap:18px;justify-content:center;align-items:center;min-height:64px}
.btn{padding:14px 40px;border-radius:999px;font-size:1.5rem;font-weight:600;border:2px solid var(--seal)}
.btn.yes{background:var(--seal);color:#fff4ef}
.btn.no{color:var(--seal)}
.btn.no.run{position:fixed;z-index:20;transition:left .25s,top .25s}
.skip{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(env(safe-area-inset-top,0px) + 12px);font-family:var(--hand);font-size:1.3rem;color:var(--muted);padding:8px;z-index:30}

/* ---------- Sí ---------- */
.yesbox{text-align:center}
.yesbox h2{font-style:italic;font-weight:600;font-size:clamp(3.4rem,17vw,6rem);line-height:1}
.yesbox p{font-family:var(--hand);font-size:clamp(1.7rem,7vw,2.4rem);margin-top:.6em;color:var(--seal)}
.heart{position:fixed;bottom:-40px;color:var(--seal);pointer-events:none;z-index:40;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:.2}}

.mute{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:30;width:42px;height:42px;font-size:1.2rem;display:none;place-items:center;border-radius:50%;border:1.5px solid var(--muted)}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01s!important;animation-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<button class="mute" id="mute" aria-label="Silenciar música">♪</button>
<button class="skip" id="skip" style="display:none">Saltar</button>

<section class="scene show" id="sEnv">
  <button class="env pulse" id="env" aria-label="Abrir el sobre">
    <span class="back"></span>
    <span class="card"><i>♥</i></span>
    <span class="front"></span>
    <span class="to">Para Valentina</span>
    <span class="flap"></span>
    <span class="seal">♥</span>
  </button>
  <p class="hint" id="hint">Toca para abrir</p>
</section>

<section class="scene" id="sPhotos">
  <div class="pol" id="pol"><img id="img" alt="Una foto de nosotros"></div>
  <div class="bar"><b id="prog"></b></div>
  <div class="count" id="count"></div>
  <div class="ctrls">
    <button id="prev" aria-label="Foto anterior">‹</button>
    <button id="pp" aria-label="Pausar">❚❚</button>
    <button id="next" aria-label="Foto siguiente">›</button>
  </div>
</section>

<section class="scene" id="sLetter">
  <div class="letter" id="letter"></div>
</section>

<section class="scene" id="sYes">
  <div class="yesbox"><h2>Sí</h2><p>Te quiero, Valentina</p></div>
</section>

<script>
const PHOTOS=["01.jpg", "02.jpg", "03.jpg", "04.jpg", "05.jpg", "06.jpg", "07.jpg", "08.jpg", "09.jpg", "10.jpg", "11.jpg", "12.jpg", "13.jpg", "14.jpg", "15.jpg", "16.jpg", "17.jpg", "18.jpg", "19.jpg", "20.jpg", "21.jpg", "22.jpg", "23.jpg", "24.jpg", "25.jpg", "26.jpg", "27.jpg", "28.jpg", "29.jpg", "30.jpg", "31.jpg", "32.jpg", "33.jpg", "34.jpg", "35.jpg"];
const SONG = "song.mp3";
const PARAS = [
`Hay encuentros en la vida que llegan sin prisa, como una brisa suave que agita el orden de las cosas y lo recoloca todo con una calma nueva y distinta. Así sentí el inicio de nuestras conversaciones: como el despertar sutil de una complicidad que no buscaba nada en absoluto y, sin embargo, terminó encontrándolo todo en ti.`,
`Desde entonces, mis días tienen otra música y otro ritmo. Hay una luz diferente en las esquinas de la rutina y una certeza constante de que esperar tu mensaje, de revisar el teléfono con ilusión o simplemente saber de ti, es el instante más cálido y esperado de cada jornada.`,
`Me fascina el mapa de tu mundo y todo lo que lo compone: la manera tan única en que tus ojos miran los pequeños detalles, la música sincera de tu risa cuando algo te sorprende y esa forma tan natural que tienes de habitar el espacio, llenándolo de una magia que no necesita artificios ni disfraces.`,
`Contigo he aprendido que la felicidad a veces cabe en lo más sencillo: una charla que se estira sin darnos cuenta hasta perder la noción del tiempo, un paseo donde el mundo exterior parece detenerse a nuestro favor, o la fortuna inmensa de poder ser exactamente quien soy a tu lado, sin armaduras, sin filtros y sin silencios fingidos. Eres ese refugio al que siempre quiero volver al final del día, un rincón de paz inmensa y al mismo tiempo una chispa constante que enciende las ganas de seguir descubriéndolo todo de tu mano.`,
`Guardo en la memoria, como tesoros profundamente sagrados, cada uno de los instantes que hemos tejido juntos hasta hoy. Las risas espontáneas que se nos escapan sin control por cualquier tontería, los caminos recorridos compartiendo el paso y las historias, las palabras dichas a media voz y hasta esos silencios tan cómodos y nuestros, donde una mirada basta para decirlo todo sin hablar.`,
`Has llenado este tiempo de una textura única e irrepetible, de momentos que se quedan suspendidos en el alma y que sé que voy a atesorar siempre con muchísimo cariño, porque hay personas que simplemente se vuelven hogar con solo estar presentes.`,
`Quería poner en estas líneas un pedacito honesto de lo que inspiras en mí, porque tu presencia ha transformado por completo mi manera de mirar la vida, de sentir los días y de valorar cada instante compartido. Gracias por este tiempo tan bonito que me has regalado, por tu complicidad, por tu ternura, por las risas, por las pláticas interminables y por regalarme el privilegio inmenso de coincidir contigo en este camino.`,
`Eres, sin duda, de lo más hermoso que la vida me ha dejado encontrar.`
];

const $ = id => document.getElementById(id);
const scenes = ['sEnv','sPhotos','sLetter','sYes'].map($);
function go(id){ scenes.forEach(s => s.classList.toggle('show', s.id === id)); }
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---- música (opcional) ---- */
let audio = null;
if (SONG) {
  audio = new Audio(SONG); audio.loop = true; audio.volume = .7;
  $('mute').style.display = 'grid';
  $('mute').onclick = () => {
    audio.muted = !audio.muted;
    $('mute').style.opacity = audio.muted ? .45 : 1;
    $('mute').setAttribute('aria-label', audio.muted ? 'Activar música' : 'Silenciar música');
  };
}

/* ---- sobre ---- */
let opened = false;
$('env').addEventListener('click', async () => {
  if (opened) return; opened = true;
  if (audio) audio.play().catch(()=>{});
  const env = $('env');
  env.classList.remove('pulse');
  $('hint').style.opacity = 0;
  env.classList.add('open');
  setTimeout(() => { env.querySelector('.flap').style.zIndex = 1; }, 450);
  await wait(2300);
  go('sPhotos');
  startPhotos();
});

/* ---- fotos ---- */
const STEP = 3400;
let idx = 0, playing = true, timer = null, ended = false;
const pol = $('pol'), img = $('img');
function show(i){
  clearTimeout(timer);
  idx = (i + PHOTOS.length) % PHOTOS.length;
  pol.classList.add('out');
  setTimeout(() => {
    pol.style.setProperty('--r', (Math.random()*5 - 2.5).toFixed(1) + 'deg');
    img.onload = () => pol.classList.remove('out');
    img.src = PHOTOS[idx];
    if (img.complete) pol.classList.remove('out');
    $('prog').style.width = ((idx + 1) / PHOTOS.length * 100) + '%';
    $('count').textContent = (idx + 1) + ' de ' + PHOTOS.length;
    if (playing) timer = setTimeout(advance, STEP);
  }, 380);
}
function advance(){
  if (idx >= PHOTOS.length - 1) { toLetter(); return; }
  show(idx + 1);
}
function startPhotos(){ idx = 0; show(0); $('skip').style.display = 'none'; }
$('next').onclick = () => { if (idx >= PHOTOS.length - 1) toLetter(); else show(idx + 1); };
$('prev').onclick = () => show(idx - 1);
$('pp').onclick = () => {
  playing = !playing;
  $('pp').textContent = playing ? '❚❚' : '▶';
  $('pp').setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
  clearTimeout(timer);
  if (playing) timer = setTimeout(advance, 1200);
};

/* ---- carta ---- */
let skipped = false;
function toLetter(){
  if (ended) return; ended = true; clearTimeout(timer);
  go('sLetter');
  $('skip').style.display = 'block';
  writeLetter();
}
async function writeLetter(){
  const box = $('letter');
  const els = PARAS.map(t => { const p = document.createElement('p'); p.textContent = t; box.appendChild(p); return p; });
  const ask = document.createElement('div'); ask.className = 'ask';
  ask.innerHTML = '<h2>¿Quieres ser mi novia?</h2><div class="btns" id="btns"><button class="btn yes" id="yes">Sí</button><button class="btn no" id="no">No</button></div>';
  box.appendChild(ask);
  wireAsk();
  await wait(1300);
  for (const p of els){
    if (skipped) break;
    p.classList.add('on');
    box.scrollTo({top: p.offsetTop - box.clientHeight * .3});
    const t = Math.min(Math.max(p.textContent.length * 20, 2600), 8500);
    await waitSkippable(t);
  }
  els.forEach(p => p.classList.add('on'));
  await wait(skipped ? 200 : 1800);
  ask.classList.add('on');
  box.scrollTo({top: ask.offsetTop - box.clientHeight * .25});
  $('skip').style.display = 'none';
}
function waitSkippable(ms){
  return new Promise(res => {
    const t0 = Date.now();
    const iv = setInterval(() => { if (skipped || Date.now() - t0 >= ms){ clearInterval(iv); res(); } }, 120);
  });
}
$('skip').onclick = () => { skipped = true; };

/* ---- pregunta ---- */
function wireAsk(){
  const no = $('no'); let dodges = 0;
  function dodge(e){
    if (e) { e.preventDefault(); e.stopPropagation(); }
    dodges++;
    if (dodges >= 7) { no.textContent = 'Mejor sí'; no.onclick = sayYes; no.classList.remove('run'); no.style.left = no.style.top = ''; no.removeEventListener('pointerenter', dodge); no.removeEventListener('pointerdown', dodge); return; }
    no.classList.add('run');
    const w = no.offsetWidth, h = no.offsetHeight;
    const x = 12 + Math.random() * (window.innerWidth - w - 24);
    const y = 90 + Math.random() * (window.innerHeight - h - 180);
    no.style.left = x + 'px'; no.style.top = y + 'px';
  }
  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('click', e => e.preventDefault());
  $('yes').onclick = sayYes;
}
function sayYes(){
  go('sYes');
  $('skip').style.display = 'none';
  const n = matchMedia('(prefers-reduced-motion: reduce)').matches ? 12 : 60;
  for (let i = 0; i < n; i++){
    const h = document.createElement('span');
    h.className = 'heart'; h.textContent = '♥';
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = (16 + Math.random() * 34) + 'px';
    h.style.animationDuration = (3.5 + Math.random() * 4) + 's';
    h.style.animationDelay = (Math.random() * 2.5) + 's';
    document.body.appendChild(h);
  }
}
</script>
</body>
</html>
